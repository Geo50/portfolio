<svg
  width="48"
  height="48"
  viewBox="0 0 48 48"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 1. Central Singularity / Planet -->
  <!-- Faint cosmic glow -->
  <circle cx="24" cy="24" r="5" fill="#60a5fa" opacity="0.25" />
  <!-- Core white nucleus -->
  <circle cx="24" cy="24" r="2" fill="#ffffff" />

  <!-- 2. The Tilted Orbital Ring (tilted at -25 degrees) -->
  <g transform="rotate(-25 24 24)">
    <!-- The ellipse track -->
    <path
      id="orbitPath"
      d="M 4,24 A 20,8 0 1,0 44,24 A 20,8 0 1,0 4,24"
      stroke="rgba(147, 197, 253, 0.35)"
      stroke-width="1"
      stroke-dasharray="3 3"
      fill="none"
    />

    <!-- 3. The Orbiting Satellite Moon -->
    <circle r="2" fill="#93c5fd">
      <!-- Built-in SVG motion animation: orbits endlessly in 3 seconds -->
      <animateMotion dur="3.5s" repeatCount="indefinite">
        <mpath href="#orbitPath" />
      </animateMotion>
    </circle>
  </g>
</svg>
